    <script>
      // Suppress Vite HMR websocket connection errors in preview/iframe environment
      (function() {
        // Intercept console.error and console.warn for Vite websocket disconnects
        var origConsoleError = console.error;
        console.error = function() {
          var str = Array.prototype.slice.call(arguments).map(function(a) {
            return (a && (a.message || a.stack || a.toString())) || '';
          }).join(' ');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('[vite]') !== -1 || str.indexOf('closed without opened') !== -1) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };

        var origConsoleWarn = console.warn;
        console.warn = function() {
          var str = Array.prototype.slice.call(arguments).map(function(a) {
            return (a && (a.message || a.stack || a.toString())) || '';
          }).join(' ');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('[vite]') !== -1 || str.indexOf('closed without opened') !== -1) {
            return;
          }
          origConsoleWarn.apply(console, arguments);
        };

        // Suppress unhandled promise rejections & error events with capture
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || reason.stack || reason.toString())) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1 || msg.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || '')) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1 || msg.indexOf('closed without opened') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Safely intercept WebSocket to prevent Vite's closed-without-opened error
        if (typeof window.WebSocket !== 'undefined') {
          var OrigWebSocket = window.WebSocket;
          function MockWebSocket(url, protocols) {
            var self = this;
            self.url = String(url || '');
            self.protocols = protocols;
            self.readyState = 1; // 1 = OPEN
            self.binaryType = 'blob';
            self.bufferedAmount = 0;
            self.extensions = '';
            self.protocol = typeof protocols === 'string' ? protocols : '';
            self.onopen = null;
            self.onclose = null;
            self.onerror = null;
            self.onmessage = null;
            self._listeners = {};

            self.addEventListener = function(type, listener) {
              if (!self._listeners[type]) self._listeners[type] = [];
              self._listeners[type].push(listener);
            };

            self.removeEventListener = function(type, listener) {
              if (!self._listeners[type]) return;
              self._listeners[type] = self._listeners[type].filter(function(l) { return l !== listener; });
            };

            self.dispatchEvent = function(event) {
              var listeners = self._listeners[event.type] || [];
              listeners.forEach(function(l) { try { l.call(self, event); } catch(e) {} });
              return true;
            };

            self.send = function() {};
            self.close = function() {
              self.readyState = 3; // CLOSED
            };

            // Trigger open event asynchronously to simulate immediate successful connection
            setTimeout(function() {
              var openEvent = { type: 'open', target: self, currentTarget: self };
              if (typeof self.onopen === 'function') {
                try { self.onopen(openEvent); } catch(e) {}
              }
              self.dispatchEvent(openEvent);
            }, 10);
          }

          MockWebSocket.prototype.CONNECTING = 0;
          MockWebSocket.prototype.OPEN = 1;
          MockWebSocket.prototype.CLOSING = 2;
          MockWebSocket.prototype.CLOSED = 3;
          MockWebSocket.CONNECTING = 0;
          MockWebSocket.OPEN = 1;
          MockWebSocket.CLOSING = 2;
          MockWebSocket.CLOSED = 3;

          window.WebSocket = MockWebSocket;
        }
      })();
    </script>
